<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexova 404</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Lucide icons as simple SVG wrappers
    const ArrowRight = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    );
    const Menu = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
    );
    const X = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    );
    const SocialIcon = ({ d, className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d={d}/>
      </svg>
    );
    const Facebook = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>;
    const Twitter = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg>;
    const Dribbble = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M19.13 5.09C15.22 9.14 10 10.44 2.25 10.94"/><path d="M21.75 12.84c-6.62-1.41-12.14 1-16.38 6.32"/><path d="M8.56 2.75c4.37 6 6 9.42 8 17.72"/></svg>;
    const Youtube = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></svg>;
    const Linkedin = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>;
    const Instagram = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>;

    const SOCIAL_ICONS = [Facebook, Twitter, Dribbble, Youtube, Linkedin, Instagram];

    const NAV_LINKS = ["Domain", "Servers", "Cloud", "Managed", "Email", "Privacy"];
    const FOOTER_COLUMNS = [
      { title: "SERVERS", links: ["Web Servers", "VPS Servers", "Cloud Servers", "Managed Instances", "Bare Metal"] },
      { title: "DOMAINS", links: ["Find Domain", "Move Domains", "DNS Manager", "Domain Costs"] },
      { title: "HELP US", links: ["Open a Ticket", "FAQs", "Docs", "Tutorials", "Forum"] },
      { title: "ABOUT", links: ["Our Story", "Leadership Team", "Press Room", "We Hire", "Alliance", "Blog"] },
    ];

    function NexovaLogo() {
      return (
        <svg viewBox="0 0 480 480" className="w-8 h-8" fill="white" aria-hidden="true">
          <path d="M480 240a240 240 0 0 0-240 240 240 240 0 0 0 240-240Z" />
          <path d="M240 0A240 240 0 0 0 0 240 240 240 0 0 0 240 0Z" />
          <path d="M480 240A240 240 0 0 0 240 0a240 240 0 0 0 240 240Z" />
          <path d="M240 480A240 240 0 0 0 0 240a240 240 0 0 0 240 240Z" />
        </svg>
      );
    }

    function Nexova404() {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [menuVisible, setMenuVisible] = useState(false);

      useEffect(() => {
        if (mobileMenuOpen) {
          const raf = requestAnimationFrame(() => setMenuVisible(true));
          return () => cancelAnimationFrame(raf);
        }
      }, [mobileMenuOpen]);

      const openMenu = () => setMobileMenuOpen(true);
      const closeMenu = () => {
        setMenuVisible(false);
        setTimeout(() => setMobileMenuOpen(false), 500);
      };

      return (
        <div className="relative min-h-screen flex flex-col bg-black overflow-hidden" style={{fontFamily:'"Helvetica Now Var", Helvetica, Arial, sans-serif'}}>
          <style>{`
            .four-oh-four { text-shadow: 0 0 80px rgba(255,255,255,0.3), 0 0 160px rgba(255,255,255,0.1); }
            .liquid-glass {
              background: rgba(255,255,255,0.01);
              backdrop-filter: blur(4px);
              -webkit-backdrop-filter: blur(4px);
              border: none;
              box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
              position: relative;
              overflow: hidden;
              transition: transform 200ms ease, box-shadow 200ms ease;
            }
            .liquid-glass:hover { transform: translateY(-1px); }
            .liquid-glass::before {
              content: '';
              position: absolute;
              inset: 0;
              border-radius: inherit;
              padding: 1.4px;
              background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
              -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
              -webkit-mask-composite: xor;
              mask-composite: exclude;
              pointer-events: none;
            }
          `}</style>

          <video className="absolute inset-0 w-full h-full object-cover" autoPlay muted loop playsInline
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260613_180732_a54afbf6-b30d-470e-861f-669871f09f67.mp4" />
          <div className="absolute inset-0 bg-black/25" />

          <div className="relative z-10 flex flex-col min-h-screen">
            <nav className="flex items-center justify-between px-6 md:px-12 lg:px-16 py-5">
              <div className="flex items-center gap-2.5">
                <NexovaLogo />
                <span className="text-white text-xl font-bold tracking-wider">NEXOVA</span>
              </div>
              <div className="hidden lg:flex items-center gap-8">
                {NAV_LINKS.map(link => <a key={link} href="#" className="text-white/80 hover:text-white text-sm tracking-wide transition-colors duration-200">{link}</a>)}
              </div>
              <a href="#" className="hidden lg:flex items-center gap-2 bg-gradient-to-r from-emerald-400 to-cyan-500 text-white text-sm font-semibold px-6 py-2.5 rounded-full">
                LOG IN <ArrowRight className="w-4 h-4" />
              </a>
              <button className="lg:hidden relative z-[60] w-8 h-8 flex items-center justify-center text-white" onClick={mobileMenuOpen ? closeMenu : openMenu} aria-label="Toggle menu">
                <Menu className={`absolute w-6 h-6 transition-all duration-300 ${mobileMenuOpen ? "opacity-0 rotate-90 scale-75" : "opacity-100 rotate-0 scale-100"}`} />
                <X className={`absolute w-6 h-6 transition-all duration-300 ${mobileMenuOpen ? "opacity-100 rotate-0 scale-100" : "opacity-0 -rotate-90 scale-75"}`} />
              </button>
            </nav>

            {mobileMenuOpen && (
              <>
                <div className={`fixed inset-0 z-40 bg-black/40 backdrop-blur-md transition-opacity duration-400 ${menuVisible ? "opacity-100" : "opacity-0"}`} onClick={closeMenu} />
                <div className="absolute left-0 right-0 top-[68px] z-50">
                  <div className="absolute inset-0 backdrop-blur-xl rounded-b-2xl" />
                  <div className="relative z-10 flex flex-col items-center py-8 gap-1">
                    {NAV_LINKS.map((link, i) => (
                      <a key={link} href="#" onClick={closeMenu} className="py-2.5 text-white/80 hover:text-white text-lg sm:text-xl font-light tracking-[0.08em] transition-all ease-out"
                        style={{transitionDuration:"400ms",transitionDelay:menuVisible?`${350+i*50}ms`:"0ms",opacity:menuVisible?1:0,transform:menuVisible?"translateY(0)":"translateY(12px)"}}>{link}</a>
                    ))}
                    <a href="#" onClick={closeMenu} className="mt-4 flex items-center gap-2 bg-gradient-to-r from-emerald-400 to-cyan-500 text-white text-sm font-semibold px-6 py-2.5 rounded-full transition-all ease-out"
                      style={{transitionDuration:"400ms",transitionDelay:menuVisible?`${350+NAV_LINKS.length*50}ms`:"0ms",opacity:menuVisible?1:0,transform:menuVisible?"translateY(0)":"translateY(12px)"}}>
                      LOG IN <ArrowRight className="w-4 h-4" />
                    </a>
                  </div>
                </div>
              </>
            )}

            <main className="flex-1 flex flex-col items-center justify-center text-center px-4 sm:px-6 py-12 sm:py-16 md:py-0">
              <h1 className="text-white/80 text-lg sm:text-3xl md:text-5xl font-light leading-snug tracking-tight mb-1 sm:mb-2">This page seems to have</h1>
              <h1 className="text-white/80 text-lg sm:text-3xl md:text-5xl font-light leading-snug tracking-tight mb-8 sm:mb-12">slipped beyond our reach :/</h1>
              <div className="relative mb-8 sm:mb-12 w-full flex justify-center overflow-visible">
                <span className="four-oh-four text-[80px] sm:text-[140px] md:text-[200px] lg:text-[260px] font-black text-white leading-none tracking-tighter select-none">404</span>
              </div>
              <a href="#" className="liquid-glass text-white text-[10px] sm:text-sm tracking-[0.15em] sm:tracking-[0.2em] font-medium px-6 sm:px-8 py-3 sm:py-3.5 rounded-full uppercase">
                Return to Main Page
              </a>
            </main>

            <footer className="relative z-10 px-4 sm:px-6 md:px-12 lg:px-16 pb-8 sm:pb-10 pt-10 sm:pt-16">
              <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 sm:gap-8 lg:gap-6">
                {FOOTER_COLUMNS.map(col => (
                  <div key={col.title}>
                    <h3 className="text-white text-[10px] sm:text-xs font-bold tracking-[0.15em] mb-3 sm:mb-4">{col.title}</h3>
                    <ul className="space-y-2 sm:space-y-2.5">
                      {col.links.map(link => <li key={link}><a href="#" className="text-white/50 hover:text-white/80 text-[10px] sm:text-xs transition-colors duration-200">{link}</a></li>)}
                    </ul>
                  </div>
                ))}
                <div className="col-span-2 lg:col-span-2">
                  <h3 className="text-white text-[10px] sm:text-xs font-bold tracking-[0.15em] mb-3 sm:mb-4">JOIN FOR EXCLUSIVE DEALS</h3>
                  <div className="flex max-w-sm">
                    <input type="email" placeholder="Type your email to sign up" className="flex-1 min-w-0 bg-white text-black text-[10px] sm:text-xs px-3 sm:px-4 py-2.5 rounded-l-md outline-none placeholder:text-black/40" />
                    <button className="bg-gradient-to-r from-emerald-400 to-cyan-500 text-white text-[10px] sm:text-xs font-bold tracking-wider px-4 sm:px-5 py-2.5 rounded-r-md whitespace-nowrap">SEND IT</button>
                  </div>
                  <h3 className="text-white text-[10px] sm:text-xs font-bold tracking-[0.15em] mt-5 sm:mt-6 mb-3">CONNECT</h3>
                  <div className="flex gap-3">
                    {SOCIAL_ICONS.map((Icon, i) => <a key={i} href="#" className="text-white/50 hover:text-white transition-colors duration-200"><Icon className="w-4 h-4" /></a>)}
                  </div>
                </div>
              </div>
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Nexova404 />);
  </script>
</body>
</html>
