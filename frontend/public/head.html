<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mainframe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const VIDEO_SRC =
      "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260530_042513_df96a13b-6155-4f6e-8b93-c9dee66fba08.mp4";
    const SENSITIVITY = 0.8;
    const NAV_LINKS = ["Labs", "Studio", "Openings", "Shop"];
    const PILL_BUTTONS = ["Pitch us an idea","Come work here","Send a brief hello","See how we operate"];

    function useTypewriter(text, speed = 38, startDelay = 600) {
      const [displayed, setDisplayed] = useState("");
      const [done, setDone] = useState(false);
      useEffect(() => {
        let interval;
        const timeout = setTimeout(() => {
          let i = 0;
          interval = setInterval(() => {
            i += 1;
            setDisplayed(text.slice(0, i));
            if (i >= text.length) { clearInterval(interval); setDone(true); }
          }, speed);
        }, startDelay);
        return () => { clearTimeout(timeout); clearInterval(interval); };
      }, [text, speed, startDelay]);
      return { displayed, done };
    }

    function CopyIcon() {
      return (
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1" stroke="currentColor" />
          <path d="M1.5 8.5V2.5C1.5 1.94772 1.94772 1.5 2.5 1.5H8.5" stroke="currentColor" />
        </svg>
      );
    }

    function Mainframe() {
      const videoRef = useRef(null);
      const prevXRef = useRef(null);
      const targetTimeRef = useRef(0);
      const seekingRef = useRef(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [pillsVisible, setPillsVisible] = useState(false);
      const [copied, setCopied] = useState(false);
      const { displayed, done } = useTypewriter("Glad you stopped in. Good taste tends to find us. Now, what are we building?");

      useEffect(() => {
        const t = setTimeout(() => setPillsVisible(true), 400);
        return () => clearTimeout(t);
      }, []);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;
        const applySeek = () => {
          if (!video.duration || Number.isNaN(video.duration)) return;
          if (seekingRef.current) return;
          if (Math.abs(targetTimeRef.current - video.currentTime) < 0.01) return;
          seekingRef.current = true;
          video.currentTime = targetTimeRef.current;
        };
        const handleSeeked = () => {
          seekingRef.current = false;
          if (Math.abs(targetTimeRef.current - video.currentTime) > 0.01) applySeek();
        };
        const handleMouseMove = (e) => {
          if (!video.duration || Number.isNaN(video.duration)) return;
          if (prevXRef.current === null) { prevXRef.current = e.clientX; return; }
          const delta = e.clientX - prevXRef.current;
          prevXRef.current = e.clientX;
          let targetTime = targetTimeRef.current + (delta / window.innerWidth) * SENSITIVITY * video.duration;
          targetTime = Math.max(0, Math.min(video.duration, targetTime));
          targetTimeRef.current = targetTime;
          applySeek();
        };
        const handleLoadedMetadata = () => { targetTimeRef.current = video.currentTime || 0; };
        video.addEventListener("seeked", handleSeeked);
        video.addEventListener("loadedmetadata", handleLoadedMetadata);
        window.addEventListener("mousemove", handleMouseMove);
        return () => {
          video.removeEventListener("seeked", handleSeeked);
          video.removeEventListener("loadedmetadata", handleLoadedMetadata);
          window.removeEventListener("mousemove", handleMouseMove);
        };
      }, []);

      const handleCopy = useCallback(async () => {
        try { await navigator.clipboard.writeText("hello@mainframe.co"); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch (err) {}
      }, []);

      return (
        <div className="relative min-h-screen" style={{fontFamily:"'Helvetica Neue', Arial, sans-serif"}}>
          <style>{`
            @keyframes mf-blink { 0%,100%{opacity:1} 50%{opacity:0} }
            .mf-cursor { animation: mf-blink 1s step-end infinite; }
          `}</style>
          <video ref={videoRef} muted playsInline preload="auto" src={VIDEO_SRC} style={{position:"fixed",inset:0,zIndex:0,width:"100%",height:"100%",objectFit:"cover",objectPosition:"70% center"}} />
          <nav className="fixed top-0 left-0 right-0 px-5 sm:px-8 py-4 sm:py-5 flex justify-between items-center" style={{zIndex:10}}>
            <div className="flex items-center gap-3">
              <span className="text-[21px] sm:text-[26px] tracking-tight text-black">Mainframe&reg;</span>
              <span className="text-[25px] sm:text-[30px] text-black select-none">✳︎</span>
            </div>
            <div className="hidden md:flex items-center text-[23px] text-black">
              {NAV_LINKS.map((link, i) => (
                <React.Fragment key={link}>
                  <a href="#" className="hover:opacity-60 transition-opacity">{link}</a>
                  {i < NAV_LINKS.length - 1 && <span>{", "}</span>}
                </React.Fragment>
              ))}
            </div>
            <a href="#" className="hidden md:inline text-[23px] text-black underline underline-offset-2 hover:opacity-60 transition-opacity">Get in touch</a>
            <button className="md:hidden flex flex-col items-center justify-center gap-[5px] w-8 h-8" onClick={() => setMenuOpen(v => !v)} aria-label="Toggle menu" style={{zIndex:10}}>
              <span className="w-6 h-[2px] bg-black transition-transform duration-300" style={{transform:menuOpen?"rotate(45deg) translate(2px,7px)":"none"}} />
              <span className="w-6 h-[2px] bg-black transition-opacity duration-300" style={{opacity:menuOpen?0:1}} />
              <span className="w-6 h-[2px] bg-black transition-transform duration-300" style={{transform:menuOpen?"rotate(-45deg) translate(2px,-7px)":"none"}} />
            </button>
          </nav>
          <div className="md:hidden fixed inset-0 bg-white/95 backdrop-blur-sm flex flex-col justify-center items-start px-8 gap-8 transition-opacity duration-300" style={{zIndex:9,opacity:menuOpen?1:0,pointerEvents:menuOpen?"auto":"none"}}>
            {NAV_LINKS.map(link => <a key={link} href="#" onClick={() => setMenuOpen(false)} className="text-[32px] font-medium text-black hover:opacity-60 transition-opacity">{link}</a>)}
            <a href="#" onClick={() => setMenuOpen(false)} className="text-[32px] font-medium text-black underline underline-offset-2 hover:opacity-60 transition-opacity">Get in touch</a>
          </div>
          <section className="relative h-screen flex flex-col justify-end pb-12 md:justify-center md:pb-0 px-5 sm:px-8 md:px-10 overflow-hidden" style={{zIndex:1}}>
            <div className="max-w-xl relative z-10">
              <p className="pointer-events-none select-none mb-5 sm:mb-6" style={{fontSize:"clamp(18px,4vw,26px)",lineHeight:1.3,fontWeight:400,color:"#000",filter:"blur(4px)"}}>
                Hey there, meet A.R.I.A,<br/>Mainframe's Adaptive Response Interface Agent
              </p>
              <p className="text-black mb-5 sm:mb-6" style={{fontSize:"clamp(18px,4vw,26px)",lineHeight:1.35,fontWeight:400,minHeight:"54px"}}>
                {displayed}
                {!done && <span className="mf-cursor inline-block w-[2px] h-[1.1em] bg-black align-middle ml-[2px]" />}
              </p>
              <div className="flex flex-wrap gap-y-1" style={{opacity:pillsVisible?1:0,transform:pillsVisible?"translateY(0)":"translateY(8px)",transition:"opacity 0.4s ease, transform 0.4s ease"}}>
                {PILL_BUTTONS.map(label => (
                  <button key={label} type="button" className="inline-flex items-center justify-center bg-white text-black border border-black/10 rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] hover:bg-black hover:text-white transition-colors duration-200" style={{whiteSpace:"nowrap"}}>{label}</button>
                ))}
                <button type="button" onClick={handleCopy} className="inline-flex items-center justify-center gap-2 sm:gap-3 text-white bg-transparent border border-white rounded-full text-[13px] sm:text-[15px] px-4 sm:px-5 py-[0.3em] mx-[0.2em] mb-[0.4em] hover:bg-white hover:text-black transition-colors duration-200" style={{whiteSpace:"nowrap"}}>
                  <span>Reach us: <span className="underline underline-offset-1">hello@mainframe.co</span></span>
                  <CopyIcon />
                </button>
              </div>
              {copied && <p className="mt-3 text-[13px] text-white/90 select-none">Copied to clipboard</p>}
            </div>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Mainframe />);
  </script>
</body>
</html>
