<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mėntality — mental wellbeing, made manageable</title>
<meta name="description" content="mėntality offers information and resources to help you manage your mental wellbeing." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ---------- tokens ---------- */
  :root {
    --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-display: "Outfit", ui-sans-serif, system-ui, sans-serif;

    --color-brand-green: #9fff00;
    --color-bg-base: #EDEEF5;
    --color-ink: #1a1a1a;
    --color-ink-muted: #8e8e8e;
  }

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--color-bg-base);
    color: #18181b;
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection {
    background: var(--color-brand-green);
    color: #000;
  }

  a {
    text-decoration: none;
    color: inherit;
  }

  button {
    font: inherit;
    border: none;
    cursor: pointer;
  }

  /* ---------- navbar ---------- */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 50;
    padding: 1.5rem 0;
    background: linear-gradient(to bottom, rgba(241, 241, 241, 0.8), transparent);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  @media (min-width: 768px) {
    .navbar {
      padding: 2.5rem 0;
    }
  }

  .navbar__inner {
    max-width: 80rem;
    margin: 0 auto;
    padding: 0 1.5rem;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    align-items: center;
  }

  @media (min-width: 768px) {
    .navbar__inner {
      padding: 0 2.5rem;
    }
  }

  .navbar__brand {
    grid-column: span 6 / span 6;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  @media (min-width: 768px) {
    .navbar__brand {
      grid-column: span 3 / span 3;
    }
  }

  .clover {
    flex-shrink: 0;
  }

  .navbar__wordmark {
    font-family: var(--font-display);
    font-size: 1.125rem;
    letter-spacing: -0.01em;
    color: var(--color-ink);
  }

  .navbar__links {
    display: none;
    grid-column: 4 / span 6;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
  }

  @media (min-width: 768px) {
    .navbar__links {
      display: flex;
    }
  }

  .navbar__links a {
    font-size: 13px;
    text-transform: lowercase;
    letter-spacing: -0.01em;
    color: rgba(26, 26, 26, 0.8);
    transition: color 0.2s ease;
  }

  .navbar__links a:hover {
    color: var(--color-ink);
  }

  .navbar__actions {
    grid-column: span 6 / span 6;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 1rem;
  }

  @media (min-width: 768px) {
    .navbar__actions {
      grid-column: 10 / span 3;
      gap: 1.5rem;
    }
  }

  .navbar__find-help {
    display: none;
    font-size: 13px;
    letter-spacing: -0.01em;
    color: rgba(26, 26, 26, 0.8);
    transition: color 0.2s ease;
  }

  @media (min-width: 768px) {
    .navbar__find-help {
      display: inline;
    }
  }

  .navbar__find-help:hover {
    color: var(--color-ink);
  }

  .navbar__cta {
    display: none;
    align-items: center;
    border-radius: 9999px;
    background: var(--color-ink);
    color: #fff;
    padding: 0.625rem 1.25rem;
    font-size: 13px;
    transition: opacity 0.2s ease;
  }

  @media (min-width: 768px) {
    .navbar__cta {
      display: inline-flex;
    }
  }

  .navbar__cta:hover {
    opacity: 0.9;
  }

  /* hamburger */
  .hamburger {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 24px;
    height: 16px;
    background: transparent;
    padding: 0;
  }

  @media (min-width: 768px) {
    .hamburger {
      display: none;
    }
  }

  .hamburger span {
    display: block;
    height: 1.5px;
    width: 100%;
    background: var(--color-ink);
    transform-origin: center;
    transition: transform 0.3s ease, opacity 0.2s ease;
  }

  .hamburger[aria-expanded="true"] span:nth-child(1) {
    transform: translateY(6.5px) rotate(45deg);
  }

  .hamburger[aria-expanded="true"] span:nth-child(2) {
    opacity: 0;
  }

  .hamburger[aria-expanded="true"] span:nth-child(3) {
    transform: translateY(-6.5px) rotate(-45deg);
  }

  /* mobile drawer */
  .mobile-drawer {
    overflow: hidden;
    max-height: 0;
    opacity: 0;
    transition: max-height 0.35s ease, opacity 0.3s ease;
  }

  .mobile-drawer.is-open {
    max-height: 24rem;
    opacity: 1;
  }

  @media (min-width: 768px) {
    .mobile-drawer {
      display: none;
    }
  }

  .mobile-drawer__links {
    margin: 1.5rem 1.5rem 0;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 1rem;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .mobile-drawer__links a {
    font-size: 0.875rem;
    letter-spacing: -0.01em;
    color: var(--color-ink);
    text-transform: lowercase;
  }

  .mobile-drawer__find-help {
    color: rgba(26, 26, 26, 0.8);
    text-transform: none !important;
  }

  .mobile-drawer__cta {
    width: fit-content;
    border-radius: 9999px;
    background: var(--color-ink);
    color: #fff;
    padding: 0.625rem 1.25rem;
    font-size: 13px;
    text-transform: none !important;
  }

  /* ---------- hero ---------- */
  .hero {
    position: relative;
    min-height: 110vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
    background: var(--color-bg-base);
  }

  @media (min-width: 640px) {
    .hero {
      min-height: 140vh;
    }
  }

  .hero__video-wrap {
    position: absolute;
    top: 15vh;
    left: 0;
    width: 100%;
    height: 95vh;
    z-index: 0;
    pointer-events: none;
  }

  @media (min-width: 640px) {
    .hero__video-wrap {
      top: 20vh;
      height: 120vh;
    }
  }

  .hero__video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 1;
    transform: scale(1.25);
    transform-origin: center center;
    transition: transform 0.5s ease;
  }

  .hero__video-mask {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6rem;
    background: linear-gradient(to bottom, var(--color-bg-base), transparent);
  }

  @media (min-width: 640px) {
    .hero__video-mask {
      height: 8rem;
    }
  }

  .hero__content {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 80rem;
    margin: 0 auto;
    padding: 8rem 2rem 0;
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    column-gap: 1rem;
  }

  @media (min-width: 768px) {
    .hero__content {
      padding: 10rem 4rem 0;
      column-gap: 2rem;
    }
  }

  @media (min-width: 1024px) {
    .hero__content {
      padding-left: 5rem;
      padding-right: 5rem;
    }
  }

  .hero__content-inner {
    grid-column: 1 / span 12;
  }

  @media (min-width: 768px) {
    .hero__content-inner {
      grid-column: 2 / span 10;
    }
  }

  .hero__heading {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 2.25rem;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0;
    opacity: 0;
    transform: translateY(15px);
    animation: rise 0.8s ease forwards;
  }

  @media (min-width: 640px) {
    .hero__heading {
      font-size: 3rem;
    }
  }

  @media (min-width: 768px) {
    .hero__heading {
      font-size: 3.75rem;
    }
  }

  @media (min-width: 1024px) {
    .hero__heading {
      font-size: 4.5rem;
    }
  }

  .hero__heading--dark {
    color: var(--color-ink);
  }

  .hero__heading--grey {
    color: var(--color-ink-muted);
  }

  .eye-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    margin: 0 4px;
    border: 2px solid var(--color-ink);
    border-radius: 9999px;
    vertical-align: middle;
  }

  @media (min-width: 768px) {
    .eye-pill {
      width: 42px;
    }
  }

  @media (min-width: 1024px) {
    .eye-pill {
      width: 62px;
    }
  }

  .eye-pill__dot {
    width: 8px;
    height: 8px;
    border-radius: 9999px;
    background: var(--color-ink);
  }

  .search-pill {
    margin-top: 2.5rem;
    max-width: 28rem;
    display: flex;
    align-items: center;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.05);
    border-radius: 6px;
    padding: 4px;
    padding-left: 1rem;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    opacity: 0;
    transform: translateY(15px);
    animation: rise 0.8s ease forwards;
    animation-delay: 0.15s;
  }

  .search-pill__input {
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    padding: 0.5rem 0;
    font-size: 0.875rem;
    color: var(--color-ink);
    font-family: var(--font-sans);
  }

  .search-pill__input::placeholder {
    color: var(--color-ink-muted);
  }

  .search-pill__button {
    flex-shrink: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 9999px;
    background: var(--color-ink);
    color: #fff;
  }

  .lang-switch {
    position: absolute;
    top: 50%;
    right: 1.5rem;
    transform: translateY(-50%);
    z-index: 10;
    padding: 0.5rem 1rem;
    font-size: 12px;
    letter-spacing: -0.01em;
    color: var(--color-ink);
    background: rgba(255, 255, 255, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 9999px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  @media (min-width: 768px) {
    .lang-switch {
      right: 2.5rem;
    }
  }

  .corner {
    position: absolute;
    bottom: 2rem;
    z-index: 10;
    font-size: 12px;
    letter-spacing: -0.01em;
    color: rgba(26, 26, 26, 0.7);
  }

  .corner--left {
    left: 1.5rem;
  }

  .corner--right {
    right: 1.5rem;
  }

  @media (min-width: 768px) {
    .corner--left {
      left: 2.5rem;
    }
    .corner--right {
      right: 2.5rem;
    }
  }

  @keyframes rise {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .hero__heading,
    .search-pill {
      animation: none;
      opacity: 1;
      transform: none;
    }
    html {
      scroll-behavior: auto;
    }
  }
</style>
</head>
<body>
  <header class="navbar">
    <div class="navbar__inner">
      <div class="navbar__brand">
        <svg class="clover" width="22" height="22" viewBox="0 0 24 24" fill="#1a1a1a" aria-hidden="true">
          <circle cx="12" cy="6.5" r="4.5" />
          <circle cx="17.5" cy="12" r="4.5" />
          <circle cx="12" cy="17.5" r="4.5" />
          <circle cx="6.5" cy="12" r="4.5" />
        </svg>
        <span class="navbar__wordmark">mėntality</span>
      </div>

      <nav class="navbar__links">
        <a href="#">service</a>
        <a href="#">patient resources</a>
        <a href="#">about us</a>
        <a href="#">education center</a>
      </nav>

      <div class="navbar__actions">
        <a href="#" class="navbar__find-help">find help</a>
        <a href="#" class="navbar__cta">get started →</a>
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>

    <div class="mobile-drawer" id="mobileDrawer">
      <nav class="mobile-drawer__links">
        <a href="#">service</a>
        <a href="#">patient resources</a>
        <a href="#">about us</a>
        <a href="#">education center</a>
        <a href="#" class="mobile-drawer__find-help">find help</a>
        <a href="#" class="mobile-drawer__cta">get started →</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero__video-wrap">
        <video
          class="hero__video"
          autoplay
          loop
          muted
          playsinline
          src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260603_132049_036591b8-6e92-4760-b94c-a7ea6eef315c.mp4"
        ></video>
        <div class="hero__video-mask"></div>
      </div>

      <div class="hero__content">
        <div class="hero__content-inner">
          <h1 class="hero__heading" id="heroHeading">
            <span class="hero__heading--dark">Mentality offers </span>
            <span class="hero__heading--grey">information</span><br />
            <span class="hero__heading--grey">and resources to help you manage</span><br />
            <span class="hero__heading--grey">
              your
              <span class="eye-pill" aria-hidden="true"><span class="eye-pill__dot"></span></span>
              mental wellbeing.
            </span>
          </h1>

          <div class="search-pill" id="searchPill">
            <input type="text" placeholder="Ask me anything..." class="search-pill__input" />
            <button class="search-pill__button" aria-label="Submit">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14" />
                <path d="M13 6l6 6-6 6" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div class="lang-switch">pl — en</div>
      <div class="corner corner--left">2024</div>
      <div class="corner corner--right">mental health tools</div>
    </section>
  </main>

  <script>
    const hamburgerBtn = document.getElementById("hamburgerBtn");
    const mobileDrawer = document.getElementById("mobileDrawer");

    function closeDrawer() {
      mobileDrawer.classList.remove("is-open");
      hamburgerBtn.setAttribute("aria-expanded", "false");
    }

    function toggleDrawer() {
      const isOpen = mobileDrawer.classList.toggle("is-open");
      hamburgerBtn.setAttribute("aria-expanded", String(isOpen));
    }

    hamburgerBtn.addEventListener("click", toggleDrawer);

    mobileDrawer.querySelectorAll("a").forEach((link) => {
      link.addEventListener("click", closeDrawer);
    });

    const desktopQuery = window.matchMedia("(min-width: 768px)");
    desktopQuery.addEventListener("change", (e) => {
      if (e.matches) closeDrawer();
    });
  </script>
</body>
</html>
