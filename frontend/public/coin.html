<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultShield Hero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Inline SVG icon components
    const ArrowRightCircle = ({ size = 20 }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="m12 16 4-4-4-4"/>
      </svg>
    );
    const Zap = ({ size = 24, color = "currentColor", style }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
        <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
      </svg>
    );
    const LockKeyhole = ({ size = 24, color = "currentColor", style }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
        <circle cx="12" cy="16" r="1"/><rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/>
      </svg>
    );
    const Fingerprint = ({ size = 24, color = "currentColor", style }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
        <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M2 12a10 10 0 0 1 18-6"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M9 6.8a6 6 0 0 1 9 5.2v2"/>
      </svg>
    );
    const MenuIcon = ({ size = 26, color = "currentColor" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
      </svg>
    );
    const XIcon = ({ size = 26, color = "currentColor" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    );

    const VIDEO_SRC = "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260518_003132_8b7edcb6-c64d-4a52-a9ca-879942e122ad.mp4";
    const NAV_LINKS = ["Vault", "Plans", "Install", "News", "Help"];
    const EASE = "cubic-bezier(0.22, 1, 0.36, 1)";

    function Logo({ size = 32 }) {
      return (
        <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} fill="none" overflow="visible" viewBox="0 0 256 256" aria-hidden="true">
          <path d="M 64 128 L 64.5 128 L 32 95 L 0 64 L 0 0 L 64 0 L 128 64 L 128 64.5 L 161 32 L 192 0 L 256 0 L 256 64 L 192 128 L 128 128 L 128 192 L 96 223 L 63.5 256 L 0 256 L 0 192 Z M 256 192 L 224 223 L 191.5 256 L 128 256 L 128 192 L 192 128 L 256 128 Z" fill="#192837" />
        </svg>
      );
    }

    function PrimaryButton({ children, className = "" }) {
      return (
        <button type="button" className={`rounded-full px-5 py-2.5 text-white text-sm font-medium ${className}`} style={{background:"#7342E2"}}>
          {children}
        </button>
      );
    }

    function SecondaryButton({ children, className = "" }) {
      return (
        <button type="button" className={`rounded-full px-5 py-2.5 text-sm font-medium ${className}`} style={{background:"#F2F2EE",color:"#192837"}}>
          {children}
        </button>
      );
    }

    function VaultShieldHero() {
      const [menuOpen, setMenuOpen] = useState(false);
      const [menuMounted, setMenuMounted] = useState(false);
      const [entered, setEntered] = useState(false);

      useEffect(() => {
        const t = setTimeout(() => setEntered(true), 50);
        return () => clearTimeout(t);
      }, []);

      const openMenu = () => {
        setMenuMounted(true);
        requestAnimationFrame(() => setMenuOpen(true));
      };
      const closeMenu = () => {
        setMenuOpen(false);
        setTimeout(() => setMenuMounted(false), 450);
      };

      const iconStyle = { display:"inline-block", verticalAlign:"middle", position:"relative", top:"-2px" };

      return (
        <div className="relative w-full min-h-screen" style={{fontFamily:"var(--font-body, 'Inter', sans-serif)",color:"var(--color-text, #192837)"}}>
          <style>{`
            :root {
              --font-heading: 'Helvetica Now Display Bold', sans-serif;
              --font-body: 'Inter', sans-serif;
              --color-text: #192837;
              --color-accent: #7342E2;
              --color-login-bg: #F2F2EE;
            }
            .vs-cta { transition: transform 200ms ease, filter 200ms ease; }
            .vs-cta:hover { transform: scale(1.04); filter: brightness(1.1); }
            .vs-cta:active { transform: scale(0.96); }
          `}</style>

          <video className="absolute inset-0 w-full h-full object-cover" autoPlay muted loop playsInline src={VIDEO_SRC} />
          <div className="absolute inset-0 bg-white/10" />

          <nav className="relative z-10 mx-auto flex items-center justify-between px-5 sm:px-8 py-4 sm:py-5" style={{maxWidth:"1280px"}}>
            <Logo />
            <div className="hidden md:flex items-center gap-8">
              {NAV_LINKS.map(link => <a key={link} href="#" className="text-sm font-medium hover:opacity-60 transition-opacity">{link}</a>)}
            </div>
            <div className="hidden md:flex items-center gap-3">
              <PrimaryButton>Start For Free</PrimaryButton>
              <SecondaryButton>Sign In</SecondaryButton>
            </div>
            <button type="button" className="md:hidden" onClick={openMenu} aria-label="Open menu">
              <MenuIcon size={26} color="#192837" />
            </button>
          </nav>

          {menuMounted && (
            <>
              <div className="fixed inset-0 z-20" style={{background:"rgba(25,40,55,0.35)",backdropFilter:"blur(4px)",WebkitBackdropFilter:"blur(4px)",opacity:menuOpen?1:0,transition:"opacity 300ms ease"}} onClick={closeMenu} />
              <div className="fixed right-0 top-0 z-30 flex flex-col" style={{width:"min(88vw, 360px)",height:"100dvh",background:"#CFC8C5",boxShadow:"-12px 0 48px rgba(25,40,55,0.18)",transform:menuOpen?"translateX(0)":"translateX(100%)",transition:`transform 450ms ${EASE}`}}>
                <div className="flex items-center justify-between px-6 py-5">
                  <Logo />
                  <button type="button" onClick={closeMenu} aria-label="Close menu"><XIcon size={26} color="#192837" /></button>
                </div>
                <div style={{height:1,background:"rgba(25,40,55,0.12)"}} />
                <div className="flex flex-col gap-6 px-6 pt-8">
                  {NAV_LINKS.map((link, i) => (
                    <a key={link} href="#" className="text-lg font-medium" style={{color:"#192837",opacity:menuOpen?1:0,transform:menuOpen?"translateY(0)":"translateY(12px)",transition:`opacity 400ms ${EASE}, transform 400ms ${EASE}`,transitionDelay:menuOpen?`${180+i*70}ms`:"0ms"}} onClick={closeMenu}>{link}</a>
                  ))}
                </div>
                <div className="mt-auto flex flex-col gap-3 px-6 pb-8">
                  <PrimaryButton className="w-full text-center">Start For Free</PrimaryButton>
                  <SecondaryButton className="w-full text-center">Sign In</SecondaryButton>
                </div>
              </div>
            </>
          )}

          <div className="relative z-10 mx-auto px-5 sm:px-8" style={{maxWidth:"1280px",paddingTop:"clamp(40px, 8vw, 72px)"}}>
            <div style={{maxWidth:"560px"}}>
              <h1 style={{fontFamily:"var(--font-heading, 'Helvetica Now Display Bold', sans-serif)",fontSize:"clamp(1.65rem, 5vw, 3rem)",lineHeight:1.05,letterSpacing:"-0.01em",color:"#192837",marginBottom:"24px",opacity:entered?1:0,transform:entered?"translateY(0)":"translateY(28px)",transition:`opacity 600ms ${EASE}, transform 600ms ${EASE}`,transitionDelay:"0ms"}}>
                <Zap size={24} color="#192837" style={iconStyle} />{" "}
                Lock Down Your Passwords{" "}
                <LockKeyhole size={24} color="#192837" style={iconStyle} />{" "}
                with Ironclad Security{" "}
                <Fingerprint size={24} color="#192837" style={iconStyle} />
              </h1>
              <p style={{fontFamily:"var(--font-body, 'Inter', sans-serif)",fontSize:"clamp(0.9rem, 2.5vw, 1.1rem)",lineHeight:1.65,opacity:entered?0.8:0,maxWidth:"560px",transform:entered?"translateY(0)":"translateY(28px)",transition:`opacity 600ms ${EASE}, transform 600ms ${EASE}`,transitionDelay:"150ms"}}>
                Zero stress, total control. VaultShield keeps you covered with unbreakable storage, one-tap access, and pro-grade tools for your non-stop world.
              </p>
              <button type="button" className="vs-cta mt-8 inline-flex items-center justify-between" style={{background:"#7342E2",color:"white",borderRadius:"50px",padding:"17px 24px",fontFamily:"var(--font-body, 'Inter', sans-serif)",fontWeight:600,fontSize:"clamp(0.9rem, 2vw, 1rem)",boxShadow:"0 4px 24px rgba(115,66,226,0.28)",minWidth:"210px",gap:"32px",opacity:entered?1:0,transform:entered?"translateY(0) scale(1)":"translateY(28px) scale(1)",transition:`opacity 600ms ${EASE}, transform 200ms ease`,transitionDelay:"300ms"}}>
                Get It Free
                <ArrowRightCircle size={20} />
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<VaultShieldHero />);
  </script>
</body>
</html>
